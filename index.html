<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
	img {
}
body {
    margin: 0;
    font-family: Georgia, serif;
}
.hero {
    width: 100%;
    height: 100vh;
    background-image: url("images/avatar.png");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-color: black;
    position: relative;
}

.title {
    position: absolute;
    width: 100%;
    font-family: Arial, sans-serif;
    font-weight: 300;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    color: white;
    font-weight: normal;
    letter-spacing: 3px;
    z-index: 2;
}

.title h1 {
    font-size: 275px;
    margin: 0;
}

.title p {
    font-size: 120px;
    margin: 0;
}

.title h2 {
    font-size: 150px;
    margin: 0;
}
.title a {
    color: white;
    text-decoration: none;
    border: 1px solid white;
    padding: 12px 25px;
    display: inline-block;
    margin-top: 25px;
    transition: 0.3s;
    border-radius: 3px;
}
.title a:hover {
    background: white;
    color: black;
    transform: scale(1.05);
}
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0, 0, 0, 0.25);
    z-index: 1;
}
.menu {
    position: absolute;
    top: 30px;
    right: 40px;
    z-index: 3;
}

.menu a {
    color: white;
    text-decoration: none;
    margin-left: 30px;
    transition: 0.3s;
}

.menu a:hover {
    opacity: 0.6;
}
body {
    opacity: 1;
    transition: opacity 0.5s;
}

body.fade-out {
    opacity: 0;
}
@media (max-width: 600px) {
    .title h1 {
    font-size: 60px;
}

.title p {
    font-size: 40px;
}

.title h2 {
    font-size: 50px;
}
}
    </style>
</head>
<body>
<div class="hero">
	<div class="overlay"></div>
<nav class="menu">
    <a href="index.html">HOME</a>
    <a href="about.html">ABOUT</a>
    <a href="contact.html">CONTACT</a>
</nav>

<div class="title">
    <h1>WELCOME</h1>
    <p>TO</p>
    <h2>W/M.TATTOO</h2>
	<a href="mailto:paccankim3@gmail.com">Liên hệ với tôi</a>
</div>
</div>
<script>
document.querySelectorAll("a").forEach(link => {
    link.addEventListener("click", function(e) {
        e.preventDefault();

        document.body.classList.add("fade-out");

        setTimeout(() => {
            window.location.href = this.href;
        }, 500);
    });
});
</script>
</body>
</html>
